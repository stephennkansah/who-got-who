<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/icons/spy-48.png" sizes="48x48" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12100c" />
    <meta name="description" content="Who Got Who - the party game of secret missions. Complete stealth tasks on your friends without getting caught." />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/spy-180.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Who Got Who — the secret-mission party game</title>

    <!-- Link previews (WhatsApp, iMessage, Messenger, X…). Invites are the main way new
         players arrive, so the card has to sell the game. Image source: assets/branding/og-card.html -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Who Got Who" />
    <meta property="og:title" content="You're invited to Who Got Who 🕵️" />
    <meta property="og:description" content="Secret missions for your next party. Tap to join the game — no app, no sign-up." />
    <meta property="og:url" content="https://whogotwho.club/" />
    <meta property="og:image" content="https://whogotwho.club/og-image.png" />
    <meta property="og:image:secure_url" content="https://whogotwho.club/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Who Got Who: secret missions for your next party" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="You're invited to Who Got Who 🕵️" />
    <meta name="twitter:description" content="Secret missions for your next party. Tap to join the game — no app, no sign-up." />
    <meta name="twitter:image" content="https://whogotwho.club/og-image.png" />

    <!-- Fonts are self-hosted and bundled with the app stylesheet -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* Pre-React shell: same ink ground as the app, so launch is one surface */
      body {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #12100c;
        color: #f1ede0;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
