name: iPhone app

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Compile and capture a simulator screenshot, or upload a signed build to TestFlight"
        required: true
        type: choice
        options: [check, release]
        default: check

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install, test and prepare bundled app
        run: |
          npm ci
          npm run typecheck
          npm test -- --watchAll=false --runInBand
          npm run ios:sync
      - name: Compile for iPhone and iPad simulator
        if: inputs.mode == 'check'
        run: |
          set -o pipefail
          xcodebuild build -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/ios-build.log"
      - name: Capture native app launch
        if: inputs.mode == 'check'
        run: bash scripts/ios-simulator-preview.sh
      - name: Attach simulator build and evidence
        if: inputs.mode == 'check' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-check-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/ios-build.log
            ${{ runner.temp }}/ios-evidence/
            ${{ runner.temp }}/derived/Build/Products/Release-iphonesimulator/
          retention-days: 7
      - name: Prepare signing key
        if: inputs.mode == 'release'
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$KEY_P8" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ]; then
            echo "::error::Add the three App Store Connect secrets documented in IOS_RELEASE.md."
            exit 1
          fi
          umask 077
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive and upload to TestFlight
        if: inputs.mode == 'release'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: T3PAKNXT8A
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" "${AUTH[@]}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
